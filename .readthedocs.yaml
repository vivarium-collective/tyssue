# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # create_gif shells out to ImageMagick; several tutorials export gifs.
    - imagemagick
  jobs:
    pre_build:
      # Generate doc/conf.py from doc/_config.yml (jupyter-book 1.x).
      - "jupyter-book config sphinx doc/"

sphinx:
  configuration: doc/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - viz
        - zarr
